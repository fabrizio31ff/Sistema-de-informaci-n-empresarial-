databases:
  - name: nubegestion-db
    databaseName: nubegestion
    user: nubegestion_user
    plan: free

services:
  - type: web
    name: nubegestion-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nubegestion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        value: "Admin123!"
